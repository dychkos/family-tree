<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Родинне дерево</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-tree">
  <header class="topbar">
    <div class="brand">
      <h1 id="title">Родинне дерево</h1>
      <p id="subtitle"></p>
    </div>
    <div class="tools">
      <div class="search">
        <input id="search" type="search" placeholder="Пошук людини…" autocomplete="off" aria-label="Пошук людини">
        <ul id="search-results" class="search-results" hidden></ul>
      </div>
    </div>
  </header>

  <main id="viewport" class="viewport">
    <div id="tree" class="tree"></div>
  </main>

  <div class="zoom" role="group" aria-label="Масштаб">
    <button id="zoom-in" title="Збільшити" aria-label="Збільшити">+</button>
    <button id="zoom-out" title="Зменшити" aria-label="Зменшити">−</button>
    <button id="zoom-fit" title="Вмістити все" aria-label="Вмістити все">⤢</button>
  </div>

  <p class="hint">Перетягуйте дерево, коліщатко або щипок змінює масштаб. Натисніть на людину, щоб відкрити її сторінку.</p>

  <script src="data/family.js"></script>
  <script src="js/common.js"></script>
  <script src="js/tree.js"></script>
</body>
</html>
